<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="Ludy Sales — conteúdos exclusivos e principais links.">
  <title>Ludy Sales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <main class="page">
    <section class="profile-card">
      <div class="profile-glow"></div>

      <div class="avatar-wrap">
        <img src="assets/fundo.jpeg" alt="Ludy Sales" class="avatar">
      </div>

      <h1>LUDY SALES</h1>
      <p class="subtitle">Conteúdos exclusivos, novidades e meus principais links 👇</p>

      <div class="links">
        <a class="link-button primary" href="#" data-link="conteudo">
          <span>🔞</span>
          <span>ACESSAR CONTEÚDO EXCLUSIVO</span>
          <span>→</span>
        </a>

        <a class="link-button" href="#" data-link="whatsapp">
          <span>💬</span>
          <span>FALAR COMIGO</span>
          <span>→</span>
        </a>

        <a class="link-button" href="#" data-link="instagram">
          <span>◎</span>
          <span>MEU INSTAGRAM</span>
          <span>→</span>
        </a>

        <a class="link-button" href="#" data-link="vip">
          <span>🔥</span>
          <span>OFERTA ESPECIAL</span>
          <span>→</span>
        </a>
      </div>

      <p class="age">+18 • Acesso destinado a maiores de 18 anos</p>
      <footer>© <span id="year"></span> Ludy Sales</footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
